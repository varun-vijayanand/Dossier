[project]
name = "dossier"
version = "0.1.0"
description = "AML alert investigation agent"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pydantic-settings>=2", "psycopg[binary]>=3.2", "pgvector>=0.3"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that need the local Postgres container"]

pythonpath = ["src"]