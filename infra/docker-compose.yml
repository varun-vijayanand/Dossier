name: dossier
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: dossier-db
    environment:
      POSTGRES_USER: dossier
      POSTGRES_PASSWORD: dossier
      POSTGRES_DB: dossier
    ports:
      - "5433:5432"
    volumes:
      - dossier_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dossier -d dossier"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dossier_pgdata: